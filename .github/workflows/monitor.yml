name: UMA Monitoramento Diário

on:
  schedule:
    - cron: "0 13 * * 1-6"  # 09:00 Campo Grande MS (UTC-4) — seg a sáb
    - cron: "54 1 * * 2-7"  # 21:54 Campo Grande MS (UTC-4) — seg a sáb (vira dia seguinte em UTC)
  workflow_dispatch:         # permite rodar manualmente pelo GitHub

jobs:
  monitorar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar monitoramento
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python sheets_monitor.py
